<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cindr</title>
  <meta name="description" content="Cindr — An atmospheric 3D campfire haven where thoughts and notes can be released into the flames.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script type="module" crossorigin src="/assets/index-CKo9Xp-x.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Clhap5D3.css">
</head>
<body>
  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- Minimal Landing Welcome Dialog Overlay -->
  <div id="welcome-modal" class="welcome-modal-overlay">
    <div class="welcome-glass-card">
      <h1 class="welcome-title">Cindr</h1>
      <p class="welcome-message">
        A campfire for the thoughts you don't want to carry.
      </p>
      <div class="welcome-enter-container">
        <button id="btn-welcome-enter" class="minimal-enter-btn" title="Press Enter to continue">
          <span class="enter-text">Enter</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Top-Right Corner Mute / Unmute Button -->
  <button id="btn-audio-mute" class="mute-btn" title="Mute/Unmute Audio" aria-label="Toggle Sound">
    <svg id="icon-audio-on" class="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
    <svg id="icon-audio-off" class="sound-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <!-- Physical Paper Slip + Pen Trigger (Bottom-Left Corner - ~200px Medium Icon) -->
  <div id="paper-slip-trigger" class="physical-paper-container" title="Write a note to cast into the fire">
    <div class="physical-paper-slip">
      <div class="paper-fold"></div>
      <div class="paper-header-badge">
        <span class="paper-badge-text">Campfire Note</span>
      </div>
      <div class="paper-lines">
        <span class="paper-line"></span>
        <span class="paper-line"></span>
        <span class="paper-line short"></span>
      </div>
      <div class="paper-prompt-hint">Write a note...</div>
      <!-- Fountain Pen Icon resting on paper -->
      <div class="physical-pen">
        <svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 19l7-7 3 3-7 7-3-3z" fill="#33261a" stroke="#d4af37"/>
          <path d="M18 13L6 1c-1.5 0-3 1.5-3 3l12 12" stroke="#d4af37"/>
          <path d="M2 22l4-1-3-3-1 4z" fill="#d4af37"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Apple Liquid Glass Note Writing Dialog Box -->
  <div id="note-modal" class="note-modal-overlay hidden">
    <div class="parchment-card apple-glass-card">
      <!-- Apple Window Header Bar -->
      <div class="apple-window-bar">
        <div class="apple-window-dots">
          <span class="dot close-dot" id="btn-close-note-dot" title="Close"></span>
          <span class="dot minimize-dot"></span>
          <span class="dot zoom-dot"></span>
        </div>
        <div class="apple-window-title">Campfire Note</div>
        <button id="btn-close-note" class="apple-close-btn" title="Close">&times;</button>
      </div>
      
      <div class="parchment-header apple-dialog-header">
        <h2 class="parchment-title apple-dialog-title">Release to the Embers</h2>
        <p class="parchment-subtitle apple-dialog-subtitle">Write a thought, secret, or wish to cast into the hearth...</p>
      </div>

      <div class="parchment-body apple-dialog-body">
        <textarea id="note-input" class="parchment-textarea apple-glass-textarea" placeholder="Write your note here..." rows="4" maxlength="220"></textarea>
      </div>

      <div class="parchment-footer apple-dialog-footer">
        <span class="char-count apple-char-count"><span id="char-num">0</span> / 220</span>
        <button id="btn-burn-note" class="burn-action-btn apple-glass-primary-btn">
          <span>Cast into Flames</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2c0 5-4 7.5-4 11a4 4 0 0 0 8 0c0-3.5-4-6-4-11z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

</body>
</html>
